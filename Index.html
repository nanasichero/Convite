<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você está convocado(a)! 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .subtitle {
            font-size: 1rem;
            margin-bottom: 25px;
            color: #e2e8f0;
        }

        .details {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: left;
        }

        .details p {
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .details p:last-child {
            margin-bottom: 0;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 8px;
            min-width: 70px;
        }

        .time-box span {
            display: block;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .time-box small {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #cbd5e1;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            background: #25d366;
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            background: #22bf5b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Aniversário</h1>
        <p class="subtitle">Você é meu convidado especial para celebrar essa data comigo!</p>

        <div class="details">
            <p>📅 <strong>Data:</strong> 28 de Novembro de 2026</p>
            <p>⏰ <strong>Horário:</strong> 13:00</p>
            <p>📍 <strong>Local:</strong> R. Joaquim Távora, 1195 - Vila Mariana, São Paulo - SP</p>
        </div>

        <div class="countdown" id="countdown">
            <div class="time-box"><span id="days">00</span><small>Dias</small></div>
            <div class="time-box"><span id="hours">00</span><small>Horas</small></div>
            <div class="time-box"><span id="minutes">00</span><small>Min</small></div>
            <div class="time-box"><span id="seconds">00</span><small>Seg</small></div>
        </div>

        <div class="btn-container">
            <!-- Botão do Cardápio -->
            <a href="https://comerfora.ifoodpago.com.br/merchant-menu/embed?menuUrl=https%3A%2F%2Fmenu.getin.app%2Fpt-br%2FVPzz2DPQ%3FskipExternalRedirect%3Dtrue&merchantUrl=https%3A%2F%2Fcomerfora.onelink.me%2FGbfh%2Fpvh1pw1b&af_channel=dinein_merchant_menu_channel&is_retargeting=false&shortlink=iyvowam1&source_caller=api_v2&onelink_id=Gbfh&c=menu_quintal_do_espeto_web_app_menu&pid=dinein_merchant_menu_pid&referrer=c%3Dmenu_quintal_do_espeto_web_app_menu%26af_android_url%3Dhttps%3A%2F%2Fcomerfora.ifoodpago.com.br%2Fmerchant-menu%2Fembed%3FmenuUrl%3Dhttps%253A%252F%252Fmenu.getin.app%252Fpt-br%252FVPzz2DPQ%253FskipExternalRedirect%253Dtrue%26merchantUrl%3Dhttps%253A%252F%252Fcomerfora.onelink.me%252FGbfh%252Fpvh1pw1b%26pid%3Ddinein_merchant_menu_pid%26af_tranid%3DMTgzOTIxMDQzMzQ3NTY0NDEyNDc%3D%26af_ios_url%3Dhttps%3A%2F%2Fcomerfora.ifoodpago.com.br%2Fmerchant-menu%2Fembed%3FmenuUrl%3Dhttps%253A%252F%252Fmenu.getin.app%252Fpt-br%252FVPzz2DPQ%253FskipExternalRedirect%253Dtrue%26merchantUrl%3Dhttps%253A%252F%252Fcomerfora.onelink.me%252FGbfh%252Fpvh1pw1b%26af_channel%3Ddinein_merchant_menu_channel" 
               target="_blank" 
               class="btn btn-secondary">
               🍽️ Ver Cardápio
            </a>

            <!-- Botão de Confirmação integrado ao Google Forms -->
            <a href="https://forms.gle/iM3jSJyHt7PhYYF27" 
               target="_blank" 
               class="btn">
               Confirme o Comparecimento
            </a>
        </div>
    </div>

    <script>
        // Data da festa: 28 de Novembro de 2026 às 13:00 (Mês 10 = Novembro, pois começa em 0)
        const partyDate = new Date(2026, 10, 28, 13, 0, 0).getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = partyDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "<h3>O evento começou! 🥳</h3>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
